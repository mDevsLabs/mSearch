name: 📦 Construction des Paquets
on:
  workflow_dispatch:
  push:
    branches:
      - canary
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cmd: npm run buildDebian
            artifact: linux-deb-package
            path: dist/app/*.deb
          - os: ubuntu-latest
            cmd: npm run buildRedhat
            artifact: linux-rpm-package
            path: dist/app/*.rpm
          - os: windows-latest
            cmd: npm run buildWindows
            artifact: windows-package
            path: |
              dist/app/*.zip
              dist/app/*.exe
          - os: macos-15
            sdkroot: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
            cmd: npm run buildMacIntel
            artifact: darwin-x86-package
            path: dist/app/*.zip
          - os: macos-15
            sdkroot: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
            cmd: npm run buildMacArm
            artifact: darwin-arm-package
            path: dist/app/*.zip
    env:
      SDKROOT: ${{ matrix.sdkroot }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: npm install --omit=optional
    - name: 🔨 Construction du paquet
      run: ${{ matrix.cmd }}
    - name: 📤 Téléversement du paquet
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.path }}

  release:
    name: 🚀 Création de la Release Draft
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
    - name: 📥 Téléchargement de tous les paquets construits
      uses: actions/download-artifact@v4
      with:
        path: dist-artifacts

    - name: ⬇️ Checkout du code pour package.json
      uses: actions/checkout@v4

    - name: 🏷️ Définition du tag et du nom de la release
      id: release_info
      run: |
        VERSION=$(node -p "require('./package.json').version")
        TAG_NAME="v${VERSION}-build.${{ github.run_number }}"
        RELEASE_TITLE="mSearch v${VERSION} (Build #${{ github.run_number }})"
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

    - name: 📂 Préparation des fichiers pour la release
      run: |
        mkdir release-files
        find dist-artifacts/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release-files/ \;
        ls -la release-files/

    - name: 🚀 Création de la release en draft
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ steps.release_info.outputs.tag_name }}" release-files/* \
          --draft \
          --title "${{ steps.release_info.outputs.release_title }}" \
          --notes "Release automatique en mode draft pour la branche \`${{ github.ref_name }}\`. Contient les paquets générés lors du build #${{ github.run_number }}."

