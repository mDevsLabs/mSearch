name: Build Package
on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cmd: npm run buildDebian
            artifact: linux-deb-package
            path: dist/app/*.deb
          - os: ubuntu-latest
            cmd: npm run buildRedhat
            artifact: linux-rpm-package
            path: dist/app/*.rpm
          - os: windows-latest
            cmd: npm run buildWindows
            artifact: windows-package
            path: |
              dist/app/*.zip
              dist/app/*.exe
          - os: macos-15
            env:
              SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
            cmd: npm run buildMacIntel
            artifact: darwin-x86-package
            path: dist/app/*.zip
          - os: macos-15
            env:
              SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
            cmd: npm run buildMacArm
            artifact: darwin-arm-package
            path: dist/app/*.zip
    env:
      SDKROOT: ${{ matrix.env.SDKROOT }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 25
    - run: npm install --omit=optional
    - name: build package
      run: ${{ matrix.cmd }}
    - name: upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.path }}

  release:
    name: Create Draft Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist-artifacts

    - name: Checkout code for package.json
      uses: actions/checkout@v4

    - name: Set release details
      id: release_info
      run: |
        VERSION=$(node -p "require('./package.json').version")
        TAG_NAME="v${VERSION}-build.${{ github.run_number }}"
        RELEASE_TITLE="mSearch v${VERSION} (Build #${{ github.run_number }})"
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

    - name: Prepare release files
      run: |
        mkdir -p release-files
        mkdir -p dist-artifacts
        find dist-artifacts/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release-files/ \;
        echo "=== Files prepared for release ==="
        ls -la release-files/
        if [ -z "$(ls -A release-files)" ]; then
          echo "❌ Error: No package files (.deb, .rpm, .zip, .exe) found for release!"
          exit 1
        fi

    - name: Create Draft Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ steps.release_info.outputs.tag_name }}" release-files/* \
          --draft \
          --title "${{ steps.release_info.outputs.release_title }}" \
          --notes "Release automatique en mode draft pour la branche \`${{ github.ref_name }}\`. Contient les paquets générés lors du build #${{ github.run_number }}."
